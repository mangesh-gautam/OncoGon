# OncoGon API microservices. Start OncoGonDB first: it creates the `oncogon-net` network.
name: oncogon-api

services:
  gateway:
    build: ./services/gateway
    container_name: oncogon-gateway
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      AUTH_SERVICE_URL: http://auth-service:8001
      # Research data. Default: the mock service below. With OncoGonResearchAPI (PostgreSQL-backed,
      # read + write) running on oncogon-net: RESEARCH_SERVICE_URL=http://oncogon-research-api:8002 in .env
      RESEARCH_SERVICE_URL: ${RESEARCH_SERVICE_URL:-http://research-service:8002}
      # Voice backend (oncogon-tts-sst, started from that repo on oncogon-net). For a voice API running
      # natively on your machine instead: VOICE_SERVICE_URL=http://host.docker.internal:8010 in .env
      VOICE_SERVICE_URL: ${VOICE_SERVICE_URL:-http://oncogon-voice-api:8000}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      AUTH_RATE_LIMIT_PER_MINUTE: ${AUTH_RATE_LIMIT_PER_MINUTE:-20}
    ports:
      - "${GATEWAY_PORT:-8000}:8000"
    depends_on:
      auth-service:
        condition: service_healthy
      research-service:
        condition: service_healthy
    networks: [oncogon-net]

  auth-service:
    build: ./services/auth
    container_name: oncogon-auth
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: postgresql+asyncpg://${AUTH_DB_USER}:${AUTH_DB_PASSWORD}@${DB_HOST:-oncogon-postgres}:5432/${POSTGRES_DB:-oncogon}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      ACCESS_TOKEN_TTL_MINUTES: ${ACCESS_TOKEN_TTL_MINUTES:-15}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-30}
    # Internal only — reachable through the gateway.
    expose: ["8001"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks: [oncogon-net]

  # Serves mock research data (app/mock/mock_data.json) until a real data layer replaces it.
  research-service:
    build: ./services/research
    container_name: oncogon-research
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
    # Internal only — reachable through the gateway.
    expose: ["8002"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks: [oncogon-net]

networks:
  oncogon-net:
    external: true
    name: oncogon-net
